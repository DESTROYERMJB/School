<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Noche Triste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root{
    --obsidian:#07070a; --charcoal:#1c1d22; --slate:#2a3340; --storm:#16202b;
    --blood:#8a0f14; --blood-hi:#c1121f; --gold:#c9a227; --gold-hi:#f2c94c; --jade:#2f5d50;
    --c1:#1b2c44; --c2:#04060c;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--obsidian);cursor:pointer;user-select:none}
  #sky,#world,#fx,#flash,#vignette,#black{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #sky{background:radial-gradient(ellipse 85% 75% at 50% 42%,var(--c1),var(--c2))}
  #fx,#flash,#vignette,#grain,#black,#credit{pointer-events:none}
  #flash{background:var(--blood-hi);mix-blend-mode:screen;opacity:0}
  #vignette{background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.5) 76%,rgba(0,0,0,.9) 100%)}
  #grain{position:fixed;left:-60px;top:-60px;width:calc(100vw + 120px);height:calc(100vh + 120px);opacity:.08;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain .6s steps(5) infinite}
  @keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-30px,18px)}40%{transform:translate(22px,-26px)}60%{transform:translate(-14px,-40px)}80%{transform:translate(36px,12px)}100%{transform:translate(0,0)}}
  #black{background:#000;opacity:1}

  #title{position:fixed;left:0;right:0;top:17vh;display:flex;justify-content:center;opacity:0;pointer-events:none;font-family:'Cormorant Garamond',Georgia,serif}
  .t-name{font-size:clamp(52px,7.6vw,132px);font-weight:300;letter-spacing:.04em;white-space:nowrap;color:#ece6d8;text-shadow:0 2px 24px rgba(0,0,0,.65)}
  .t-name span{display:inline-block}
  #credit{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;font-family:'Cormorant Garamond',Georgia,serif}
  .cr-by{font-size:clamp(15px,1.35vw,22px);font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:#aaa497;padding-left:.42em}
  .cr-name{font-size:clamp(40px,5vw,84px);font-weight:300;letter-spacing:.03em;white-space:nowrap;color:#ece6d8}
  .cr-name span{display:inline-block}
</style>
</head>
<body>
<div id="sky"></div>

<svg id="world" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- sky -->
    <linearGradient id="nightSkyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050b"/><stop offset=".45" stop-color="#0c182a"/><stop offset=".8" stop-color="#1e3048"/><stop offset="1" stop-color="#2c3d52"/>
    </linearGradient>
    <radialGradient id="milkyG"><stop offset="0" stop-color="#c8d4ea" stop-opacity=".13"/><stop offset="1" stop-color="#c8d4ea" stop-opacity="0"/></radialGradient>
    <radialGradient id="skyMoonG"><stop offset="0" stop-color="#f1e6c4" stop-opacity=".35"/><stop offset="1" stop-color="#f1e6c4" stop-opacity="0"/></radialGradient>
    <linearGradient id="valleyLakeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a5670"/><stop offset="1" stop-color="#0f1a24"/></linearGradient>
    <mask id="crescentM"><circle cx="1250" cy="170" r="46" fill="#fff"/><circle cx="1270" cy="158" r="42" fill="#000"/></mask>

    <!-- map -->
    <radialGradient id="landG" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#211f17"/><stop offset="1" stop-color="#0b0b09"/></radialGradient>
    <radialGradient id="lakeG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#21433d"/><stop offset=".6" stop-color="#132826"/><stop offset="1" stop-color="#0a1615"/>
    </radialGradient>
    <radialGradient id="cloudShadowG"><stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <pattern id="cropA" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#2f4d2b"/><path d="M0 2H4" stroke="#24391f" stroke-width="1"/></pattern>
    <pattern id="cropB" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#3b5a2e"/><path d="M0 2H4" stroke="#2b4422" stroke-width="1"/></pattern>
    <pattern id="cropC" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#57562b"/><path d="M2 0V4" stroke="#43421f" stroke-width="1"/></pattern>
    <pattern id="stairP" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#c4b48a"/><path d="M0 0V3" stroke="#6d6248" stroke-width="1"/></pattern>
    <pattern id="pavP" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#4a4232"/><path d="M0 0H8M0 0V8" stroke="#5c5341" stroke-width=".6"/></pattern>
    <clipPath id="islandClip"><path id="islandClipPath"/></clipPath>
    <clipPath id="lakeClip"><path id="lakeClipPath"/></clipPath>

    <!-- treasury -->
    <radialGradient id="goldGlow">
      <stop offset="0" stop-color="#f2c94c" stop-opacity=".6"/><stop offset=".45" stop-color="#c9a227" stop-opacity=".18"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe79a"/><stop offset=".45" stop-color="#d4a92c"/><stop offset="1" stop-color="#6e500f"/>
    </linearGradient>
    <radialGradient id="faceG" cx=".45" cy=".4"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#a67a14"/></radialGradient>
    <linearGradient id="pillarG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#140e06"/><stop offset=".35" stop-color="#33260f"/><stop offset=".7" stop-color="#241a0b"/><stop offset="1" stop-color="#0e0a04"/>
    </linearGradient>
    <pattern id="fretP" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#1c150a"/>
      <path d="M6 44V6H38V32H18V18H28" fill="none" stroke="#c9a227" stroke-width="4"/>
      <path d="M26 44H44V38" fill="none" stroke="#8c6d16" stroke-width="4"/>
    </pattern>
    <pattern id="fretS" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="scale(.42)">
      <rect width="48" height="48" fill="#1c150a"/>
      <path d="M6 44V6H38V32H18V18H28" fill="none" stroke="#c9a227" stroke-width="5"/>
    </pattern>
    <pattern id="fretV" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(90) scale(.75)">
      <rect width="48" height="48" fill="#1c150a"/>
      <path d="M6 44V6H38V32H18V18H28" fill="none" stroke="#c9a227" stroke-width="4"/>
    </pattern>
    <pattern id="mosaicP" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#2f8f7a"/><rect x="5" width="5" height="5" fill="#25705f"/>
      <rect y="5" width="5" height="5" fill="#46b39a"/><rect x="5" y="5" width="5" height="5" fill="#3aa38c"/>
      <path d="M0 0H10M0 5H10M0 0V10M5 0V10" stroke="#0e2a24" stroke-width=".6"/>
    </pattern>

    <!-- night / tree -->
    <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2531"/><stop offset="1" stop-color="#03060a"/></linearGradient>
    <radialGradient id="fogG"><stop offset="0" stop-color="#b4c3d1" stop-opacity=".15"/><stop offset="1" stop-color="#b4c3d1" stop-opacity="0"/></radialGradient>
    <radialGradient id="moonG"><stop offset="0" stop-color="#e8dcb8" stop-opacity=".34"/><stop offset=".35" stop-color="#a99f88" stop-opacity=".1"/><stop offset="1" stop-color="#a99f88" stop-opacity="0"/></radialGradient>
    <radialGradient id="moonDisk" cx=".42" cy=".4"><stop offset="0" stop-color="#f3ead2"/><stop offset="1" stop-color="#a8a08a"/></radialGradient>
    <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25272c"/><stop offset=".25" stop-color="#121316"/><stop offset="1" stop-color="#030304"/></linearGradient>
    <linearGradient id="shadowG" gradientUnits="userSpaceOnUse" x1="800" y1="656" x2="200" y2="905"><stop offset="0" stop-color="#000" stop-opacity=".95"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>

    <!-- filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sunF" x="-30%" y="-30%" width="160%" height="160%">
      <feColorMatrix id="sunSat" type="saturate" values="1" result="s"/>
      <feGaussianBlur id="sunBlur" in="s" stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="s"/></feMerge>
    </filter>
    <filter id="roomF"><feColorMatrix id="roomSat" type="saturate" values="1"/></filter>
    <filter id="nightBlur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="nbBlur" stdDeviation="0"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <g id="cam">
    <!-- SCENE 0 : the night sky over the Valley of Mexico -->
    <g id="s0">
      <rect x="-200" y="-200" width="2000" height="1100" fill="url(#nightSkyG)"/>
      <ellipse cx="700" cy="250" rx="950" ry="95" fill="url(#milkyG)" transform="rotate(-16 700 250)"/>
      <g id="stars"></g>
      <circle cx="1250" cy="170" r="170" fill="url(#skyMoonG)"/>
      <circle cx="1250" cy="170" r="46" fill="#f1e6c4" mask="url(#crescentM)"/>
      <path id="meteor" d="M0 0 L120 40" stroke="#eef2fa" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="40 220" stroke-dashoffset="40" opacity="0"/>
      <g id="cloudsBack"></g>
      <g id="eagle"><g id="eagleWings"></g></g>
      <g id="ranges"></g>
      <g id="cloudsMid"></g>
      <g id="cloudsFront"><g id="cloudsFrontDrift"></g></g>
    </g>

    <!-- SCENE 1 : Tenochtitlan -->
    <g id="s1" opacity="0"><g id="s1z"><g id="s1b">
      <rect x="-300" y="-6" width="2200" height="1250" fill="url(#landG)"/>
      <g id="terrain"></g>
      <path id="lake" fill="url(#lakeG)" stroke="#3b3926" stroke-width="7"/>
      <path id="foam" fill="none" stroke="#8fbab0" stroke-opacity=".22" stroke-width="1.5"/>
      <g clip-path="url(#lakeClip)">
        <g id="ripples"></g>
        <g id="waves"></g>
        <g id="reeds"></g>
        <path id="dike" d="M1035 75 Q1075 300 1060 470 Q1045 680 1010 830" fill="none" stroke="#3d3626" stroke-width="5"/>
        <path d="M1035 75 Q1075 300 1060 470 Q1045 680 1010 830" fill="none" stroke="#8a7a52" stroke-width="8" stroke-dasharray="1.6 9"/>
        <g id="lakeCanoes"></g>
      </g>
      <path id="aqueduct" d="M70 575 Q340 540 612 472" fill="none" stroke="#6d6248" stroke-width="5"/>
      <path d="M70 575 Q340 540 612 472" fill="none" stroke="#4f8fae" stroke-width="1.6" stroke-opacity=".8"/>
      <g id="causeways"></g>
      <g id="islands">
        <path id="island" fill="#0f2a29" stroke="#c9a227" stroke-opacity=".55" stroke-width="1.6"/>
        <g id="chin" clip-path="url(#islandClip)"></g>
        <g id="canals" clip-path="url(#islandClip)" stroke="#0f2a29" stroke-width="4"></g>
      </g>
      <circle id="preGlow" cx="800" cy="452" r="140" fill="url(#goldGlow)" opacity=".3"/>
      <g id="precinct"></g>
      <rect id="quarters" x="670" y="419" width="52" height="52" fill="rgba(193,18,31,.18)" stroke="#c1121f" stroke-width="2"/>
      <path id="runner" d="M676 445 L612 455 L330 445 L30 420" fill="none" stroke="#c1121f" stroke-width="4" stroke-linecap="round" filter="url(#glow)" opacity=".9" stroke-dasharray="0 9999"/>
      <g id="mountains"></g>
      <g id="landTrees"></g>
      <g id="cloudShadows"></g>
      <g id="egrets"></g>
    </g></g></g>

    <!-- SCENE 2 : the treasury -->
    <g id="s2" opacity="0"><g id="s2z">
      <g id="roomBack" filter="url(#roomF)"></g>
      <circle id="halo" cx="800" cy="450" r="560" fill="url(#goldGlow)" opacity=".6"/>
      <g id="sunAll">
        <g id="sun" filter="url(#sunF)">
          <g id="sunOuter"></g>
          <g id="sunOllin"></g>
          <g id="sunFace"></g>
        </g>
      </g>
      <g id="roomFront" filter="url(#roomF)"></g>
    </g></g>

    <!-- SCENES 3 + 4 : the causeway at night -->
    <g id="night" opacity="0">
      <g id="s3a">
        <path id="bolt" d="M0 0" fill="none" stroke="#e8eef5" stroke-width="2.2" opacity="0" filter="url(#glow)"/>
        <g id="city"></g>
        <rect id="water" x="-200" y="470" width="2000" height="600" fill="url(#waterG)"/>
        <line x1="-200" y1="470" x2="1800" y2="470" stroke="#a0b4c8" stroke-opacity=".18"/>
        <g id="shimmer"></g>
      </g>
      <g class="s4" id="s4back" opacity="0">
        <rect id="redWater" x="-200" y="471" width="2000" height="600" fill="#5c0a0e" opacity="0"/>
      </g>
      <g id="s3b">
        <g id="causeway"></g>
        <g id="bridge"></g>
        <g id="march"></g>
      </g>
      <g class="s4" id="s4front" opacity="0">
        <g id="canoesFront"></g>
        <g id="sinks"></g>
        <g id="volley"></g>
      </g>
      <g id="fogs"></g>
    </g>

    <!-- SCENE 5 : El Árbol de la Noche Triste -->
    <g id="s5" opacity="0">
      <circle id="moonHalo" cx="930" cy="280" r="430" fill="url(#moonG)"/>
      <circle id="moon" cx="930" cy="280" r="100" fill="url(#moonDisk)" opacity=".85"/>
      <rect id="ground" x="-200" y="652" width="2000" height="400" fill="url(#groundG)"/>
      <line x1="-200" y1="652" x2="1800" y2="652" stroke="#d9cfb2" stroke-opacity=".12"/>
      <path id="shadow" d="M735 656 L872 656 L380 905 L10 905 Z" fill="url(#shadowG)" filter="url(#soft)"/>
      <g id="crown"></g>
      <g fill="none" stroke="#08080a" stroke-linecap="round">
        <path d="M712 652 Q660 650 610 660" stroke-width="10"/>
        <path d="M890 652 Q950 648 1010 662" stroke-width="10"/>
        <path d="M760 654 Q730 664 690 672" stroke-width="7"/>
        <path d="M850 654 Q880 664 925 674" stroke-width="7"/>
      </g>
      <path id="trunk" d="M688 654 C730 646 758 612 764 560 C769 515 774 480 758 420 C776 432 790 425 800 405 C810 425 826 430 844 418 C828 478 830 515 836 560 C842 612 870 646 912 654 Z" fill="#08080a"/>
      <g fill="none" stroke="#17171b" stroke-width="2" stroke-linecap="round">
        <path d="M782 640 Q786 560 781 470"/><path d="M812 645 Q808 560 815 465"/><path d="M748 646 Q770 600 772 540"/><path d="M856 646 Q834 600 828 540"/>
      </g>
      <path id="rim" d="M844 418 C828 478 830 515 836 560 C842 612 870 646 912 654" fill="none" stroke="#e6d6a8" stroke-width="2.2" opacity=".45"/>
      <g id="lostGold" opacity=".55">
        <path d="M968 676 L1004 676 L998 664 L974 664 Z" fill="url(#barG)" stroke="#6b4e10"/>
      </g>
    </g>
  </g>
</svg>

<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="title">
  <div class="t-name" id="tName">La Noche Triste</div>
</div>
<div id="black"></div>

<div id="credit">
  <div class="cr-by">Created by</div>
  <div class="cr-name" id="crName">Matthew Bradbury</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const R = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const f1 = n => n.toFixed(1);
  const world = $('#world');
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  /* ============================================================
     BUILD (runs once; the SVG is then snapshotted for clean resets)
     ============================================================ */

  // ---------- Scene 0 : sky ----------
  function cloud(parent, x, y, w, body, rim, shade) {
    const g = el('g', {}, parent);
    const n = Math.round(w / 45) + 3, h = w * .17;
    const puffs = [];
    for (let i = 0; i < n; i++) {
      const t = (i + .5) / n;
      const cx = x - w / 2 + t * w + R(-8, 8);
      const r = h * (.45 + Math.sin(t * Math.PI) * R(.55, .85));
      puffs.push([cx, y - r * .45, r]);
    }
    puffs.forEach(([cx, cy, r]) => el('circle', { cx: f1(cx - 2), cy: f1(cy - 4), r: f1(r), fill: rim }, g));
    puffs.forEach(([cx, cy, r]) => el('circle', { cx: f1(cx), cy: f1(cy), r: f1(r), fill: body }, g));
    el('ellipse', { cx: x, cy: y + h * .15, rx: w * .52, ry: h * .45, fill: shade }, g);
    el('rect', { x: x - w * .5, y: y - 2, width: w, height: h * .25, fill: body }, g);
  }
  function buildSky() {
    const st = $('#stars');
    for (let i = 0; i < 280; i++) {
      const big = Math.random() > .86;
      el('circle', { class: Math.random() < .35 ? 'tw' : '', cx: f1(R(-100, 1700)), cy: f1(R(-40, 620)), r: f1(big ? R(1.3, 2.1) : R(.4, 1.2)), fill: pick(['#e8ecf5', '#f5ecd2', '#d8e2f5']), opacity: f1(R(.35, 1)) }, st);
    }
    for (let i = 0; i < 16; i++) {
      const x = R(0, 1600), y = R(0, 520), s = R(4, 9);
      el('path', { class: 'tw2', d: `M${f1(x)} ${f1(y - s)} L${f1(x + s * .2)} ${f1(y - s * .2)} L${f1(x + s)} ${f1(y)} L${f1(x + s * .2)} ${f1(y + s * .2)} L${f1(x)} ${f1(y + s)} L${f1(x - s * .2)} ${f1(y + s * .2)} L${f1(x - s)} ${f1(y)} L${f1(x - s * .2)} ${f1(y - s * .2)}Z`, fill: '#f5f0dc' }, st);
    }
    const cb = $('#cloudsBack'), cm = $('#cloudsMid'), cf = $('#cloudsFrontDrift');
    for (let i = 0; i < 7; i++) cloud(cb, R(-100, 1700), R(150, 380), R(170, 290), '#122036', '#2c3e5a', '#0d182a');
    for (let i = 0; i < 5; i++) cloud(cm, R(-100, 1700), R(420, 560), R(280, 440), '#16253c', '#36507a', '#0f1b2d');
    for (let i = 0; i < 5; i++) cloud(cf, -150 + i * 420 + R(-60, 60), R(930, 980), R(460, 640), '#1a2a42', '#3f5a84', '#111e32');

    // eagle
    const ew = $('#eagleWings'), eg = $('#eagle');
    const wing = 'M0 0 C-18 -10 -40 -14 -66 -6 C-54 -3 -46 0 -38 2 C-46 3 -52 7 -58 11 C-38 7 -20 7 -6 4 Z';
    el('path', { d: wing, fill: '#05080d' }, ew);
    el('path', { d: wing, fill: '#05080d', transform: 'scale(-1 1)' }, ew);
    el('path', { d: 'M-5 -3 Q0 -10 5 -3 L4 10 L9 20 L0 16 L-9 20 L-4 10 Z', fill: '#05080d' }, eg);

    // the volcanoes and the valley
    const rg = $('#ranges');
    el('path', { d: 'M200 840 L330 690 Q380 640 430 660 L520 625 Q560 610 600 630 L680 650 Q730 640 760 668 L920 840 Z', fill: '#1b2636' }, rg);
    el('path', { d: 'M335 684 Q380 640 430 660 L520 625 Q560 610 600 630 L680 650 Q730 640 755 666 L735 671 Q700 662 680 670 L600 650 Q560 634 520 646 L430 680 Q386 662 346 692 Z', fill: '#b9c5d3', opacity: .7 }, rg);
    el('path', { d: 'M880 840 L1120 574 Q1150 556 1180 574 L1430 840 Z', fill: '#1d2939' }, rg);
    el('path', { d: 'M1080 618 L1120 574 Q1150 556 1180 574 L1222 620 L1203 612 L1186 630 L1166 608 L1146 632 L1126 610 L1104 628 Z', fill: '#c5d0dc', opacity: .78 }, rg);
    el('path', { d: 'M1150 560 L1100 840 M1150 560 L1210 840 M1150 560 L1290 840', stroke: '#2a3a50', 'stroke-width': 1.5, fill: 'none', opacity: .6 }, rg);
    el('path', { d: 'M430 662 L380 840 M520 628 L520 840 M600 632 L650 840', stroke: '#2a3a50', 'stroke-width': 1.5, fill: 'none', opacity: .6 }, rg);
    for (let i = 0; i < 7; i++) el('circle', { class: 'puff', cx: 1150, cy: 552, r: 16, fill: '#2c3646', opacity: 0 }, rg);
    // the valley lake with Tenochtitlan as a speck of fire
    el('rect', { x: 200, y: 826, width: 1200, height: 40, fill: 'url(#valleyLakeG)' }, rg);

  function resize() {

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(3, (now - last) / 16.67); last = now;
    ctx.clearRect(0, 0, W, H);
    const n = Math.min(parts.length, FX.count | 0), t = now / 1000;
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgb(${FX.r | 0},${FX.g | 0},${FX.b | 0})`;
    for (let i = 0; i < n; i++) {
      const p = parts[i], bvx = FX.wind * p.k, bvy = FX.vy * p.k;
      p.x += (bvx + Math.sin(t * p.f + p.ph) * FX.sway + (Math.random() - .5) * FX.jitter) * dt;
      p.y += (bvy + (Math.random() - .5) * FX.jitter * .5) * dt;
      if (p.y > H + 30) { p.y = -30; p.x = R(-100, W + 100); }
      else if (p.y < -30) { p.y = H + 30; p.x = R(-100, W + 100); }
      if (p.x < -120) p.x += W + 240; else if (p.x > W + 120) p.x -= W + 240;
      ctx.globalAlpha = FX.alpha * p.a;
      ctx.lineWidth = FX.size * p.s;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - bvx * FX.len - .01, p.y - bvy * FX.len); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

    if (!CST.has(c)) CST.set(c, { x: -400, y: +c.dataset.y, s: +c.dataset.s, dx: 0 });
    return CST.get(c);
  }
  function placeCanoe(c) {
    const st = canoeState(c);
    c.setAttribute('transform', `translate(${f1(st.x + st.dx)} ${f1(st.y)}) scale(${st.s})`);
  }
  function shakeLoop() {
    if (!S.chaos && S.shake < .05) { gsap.to('#cam', { x: 0, y: 0, rotation: 0, svgOrigin: '800 450', duration: .4 }); return; }
    const a = S.shake;
    gsap.to('#cam', { x: R(-a, a), y: R(-a * .7, a * .7), rotation: R(-a * .03, a * .03), svgOrigin: '800 450', duration: R(.04, .09), ease: 'none', onComplete: shakeLoop });
  }
  function shoot(a) {
    if (!S.chaos) { a.setAttribute('opacity', 0); return; }
    const low = Math.random() < .65;
    const sx = R(-60, 1660), sy = low ? R(700, 950) : R(470, 520), ex = sx + R(-320, 320), ey = R(520, 590);
    const o = { t: 0 };
    a.setAttribute('opacity', .9);
    gsap.to(o, { t: 1, duration: R(.35, .6), ease: 'none',
      onUpdate() {
        const pt = t => [sx + (ex - sx) * t, sy + (ey - sy) * t - Math.sin(t * Math.PI) * 70];
        const [x, y] = pt(o.t), [nx, ny] = pt(o.t + .02);
        a.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) rotate(${f1(Math.atan2(ny - y, nx - x) * 180 / Math.PI)})`);
      },
      onComplete() { a.setAttribute('opacity', 0); gsap.delayedCall(R(.1, 1.2), () => shoot(a)); } });
  }
  function sink(g) {
    if (!S.chaos) return;
    const x = R(80, 1520), y = Math.random() < .75 ? R(630, 870) : R(485, 535);
    g.setAttribute('transform', `translate(${x.toFixed(0)} ${y.toFixed(0)}) scale(${y < 600 ? .55 : 1})`);
    const [r1, r2] = g.querySelectorAll('.ring'), gold = g.querySelector('.gold');
    gsap.timeline({ onComplete: () => gsap.delayedCall(R(.2, 1.5), () => sink(g)) })
      .fromTo(gold, { y: -40, opacity: 1 }, { y: 0, duration: .4, ease: 'power2.in' })
      .to(gold, { y: 16, opacity: 0, duration: .7, ease: 'power1.in' })
      .fromTo(r1, { attr: { rx: 2, ry: .6 }, opacity: .9 }, { attr: { rx: 48, ry: 13 }, opacity: 0, duration: 1.5, ease: 'power2.out' }, .4)
      .fromTo(r2, { attr: { rx: 2, ry: .6 }, opacity: .7 }, { attr: { rx: 28, ry: 8 }, opacity: 0, duration: 1.1, ease: 'power2.out' }, .6);
  }
  function redPulse() {
    if (!S.chaos) return;
    gsap.fromTo('#flash', { opacity: R(.22, .5) }, { opacity: R(.04, .14), duration: R(.3, .9), ease: 'power2.out', onComplete: () => gsap.delayedCall(R(.1, .9), redPulse) });
  }
  function amb4a() {
    gsap.set('#flash', { backgroundColor: '#c1121f' });
    $$('.canoe .rock').forEach(r => gsap.fromTo(r, { rotation: R(-5, -2) }, { rotation: R(2, 5), transformOrigin: '50% 50%', duration: R(.6, 1.1), yoyo: true, repeat: -1, ease: 'sine.inOut' }));
    $$('.arrow').forEach((a, i) => gsap.delayedCall(i * .12, () => shoot(a)));
    $$('.sink').forEach((g, i) => gsap.delayedCall(i * .3, () => sink(g)));
    redPulse();
  }
  function amb4b() {
    $$('.canoe').forEach(c => gsap.to(canoeState(c), { dx: R(-70, 70), duration: R(3, 5), yoyo: true, repeat: -1, ease: 'sine.inOut', onUpdate: () => placeCanoe(c) }));
  }
  function amb5() {
    $$('.willow').forEach(w => {
      gsap.set(w, { svgOrigin: `${w.dataset.x} ${w.dataset.y}` });
      gsap.fromTo(w, { rotation: R(-3, -1.2) }, { rotation: R(1.2, 3), duration: R(3, 5.5), yoyo: true, repeat: -1, ease: 'sine.inOut' });
    });
    gsap.fromTo('#crown', { rotation: -.4 }, { rotation: .5, svgOrigin: '800 652', duration: 6, yoyo: true, repeat: -1, ease: 'sine.inOut' });
    gsap.to('#moonHalo', { scale: 1.05, svgOrigin: '930 280', duration: 5, yoyo: true, repeat: -1, ease: 'sine.inOut' });
  }

  /* ============================================================
     TRANSITIONS
     ============================================================ */

  // the city assembling itself as the camera arrives
  function cityDraw() {
    const tl = gsap.timeline();
    tl.from('#island', { opacity: 0, duration: 1.4 }, 0)
      .from('.ch', { opacity: 0, duration: .6, stagger: (i, t) => +t.dataset.d * .005 }, .2)
      .from('#canals', { opacity: 0, duration: 1.5 }, .6)
      .from('#precinct, #preGlow', { opacity: 0, scale: .6, svgOrigin: '800 452', duration: 1.4, ease: 'back.out(1.6)' }, 1)
      .from('.cwd', { opacity: 0, duration: 1.2 }, 2)
      .from('#quarters', { opacity: 0, duration: 1 }, 2.4);
    $$('.cw').forEach(p => {
      const L = p.getTotalLength();
      tl.fromTo(p, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 2.2, ease: 'power2.inOut' }, .5);
    });
    return tl;
  }

  // 0 → 1 : the camera tilts down from the stars to the island
  function t01() {
    S.sky = false;
    const tl = gsap.timeline();
    gsap.set('#s1', { opacity: 1, y: 900 });
    tl.to('#title', { opacity: 0, y: -120, duration: 2.2, ease: 'power2.in' }, 0)
      .to('#s0', { y: -900, duration: 5.4, ease: 'power2.inOut' }, 0)
      .to('#cloudsFront', { y: -650, duration: 5.4, ease: 'power2.inOut' }, 0)
      .to('#cloudsMid', { y: -250, duration: 5.4, ease: 'power2.inOut' }, 0)
      .to('#s1', { y: 0, duration: 5.4, ease: 'power2.inOut' }, 0)
      .add(look(1, 4), .8)
      .add(cityDraw(), 2.8)
      .call(amb1, null, 5.4)
      .call(() => gsap.killTweensOf($$('#s0 *')), null, 5.5)
      .set('#s0', { display: 'none' }, 5.5);
    return tl;
  }

  // 1 → 2 : dive into the heart of the city (log-scale zoom)
  function t12() {
    const tl = gsap.timeline(), z = { v: 0 };
    gsap.set('#s2', { opacity: 0 });
    gsap.set('#s2z', { scale: 1 / 16, svgOrigin: '800 452' });
    tl.to(z, { v: 1, duration: 4.4, ease: 'power2.inOut',
      onUpdate() {
        const s = Math.pow(16, z.v);
        gsap.set('#s1z', { scale: s, svgOrigin: '800 452' });
        gsap.set('#s2z', { scale: s / 16, svgOrigin: '800 452' });
      } }, 0)
      .to('#s2', { opacity: 1, duration: 1.6, ease: 'sine.inOut' }, 1.4)
      .to('#s1', { opacity: 0, duration: 1.4, ease: 'sine.in' }, 2.7)
      .add(look(2, 3), 1.2)
      .call(amb2, null, 1.5)
      .call(() => gsap.killTweensOf($$('#s1 *')), null, 4.4)
      .set('#s1', { display: 'none' }, 4.4);
    return tl;
  }

  // 2 → 3 : the gold bleeds out, the storm bleeds in
  function t23() {
    gsap.killTweensOf('#halo, #sunBlur');
    const tl = gsap.timeline();
    tl.to('#sunSat, #roomSat', { attr: { values: 0 }, duration: 4, ease: 'sine.inOut' }, 0)
      .to('#sunBlur', { attr: { stdDeviation: 0 }, duration: 3 }, 0)
      .to('#halo', { opacity: 0, duration: 3.5 }, 0)
      .to('#sunAll', { y: 140, scale: .85, svgOrigin: '800 450', opacity: 0, duration: 5, ease: 'power2.in' }, 1)
      .to('#roomFront', { opacity: 0, y: 60, duration: 3.5 }, 1.2)
      .to('#roomBack', { opacity: 0, duration: 4 }, 1.5)
      .add(look(3, 5), .8)
      .fromTo('#night', { opacity: 0 }, { opacity: 1, duration: 3.5, ease: 'sine.inOut' }, 2.5)
      .fromTo('.blk', { opacity: 0 }, { opacity: 1, duration: 1.6, stagger: { each: .04, from: 'end' } }, 3)
      .fromTo('#march', { opacity: 0 }, { opacity: 1, duration: 2 }, 4.5)
      .call(() => { S.storm = true; amb3(); }, null, 3)
      .fromTo('.plank', { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: .5, stagger: .07, ease: 'power2.out' }, 5.2)
      .call(() => gsap.killTweensOf($$('#s2 *')), null, 6.9)
      .set('#s2', { display: 'none' }, 7);
    return tl;
  }

  // 3 → 4 : the alarm, the ambush, the drowning
  function t34() {
    S.storm = false;
    gsap.killTweensOf('.fig .body');
    gsap.killTweensOf('#flash');
    const tl = gsap.timeline();
    tl.set('#flash', { backgroundColor: '#ffffff' }, 0)
      .fromTo('#flash', { opacity: .9 }, { opacity: 0, duration: .22 }, 0)
      .set('#flash', { backgroundColor: '#c1121f' }, .22)
      .fromTo('#flash', { opacity: .75 }, { opacity: .15, duration: .7 }, .22)
      .call(() => { S.chaos = true; S.shake = 14; shakeLoop(); }, null, .2)
      .add(look(4, .8), .2)
      .to('#s4back, #s4front', { opacity: 1, duration: .4 }, .2)
      .to('#redWater', { opacity: .38, duration: 2 }, .3)
      .to('.plank', { x: () => R(-150, 150), y: () => R(140, 320), rotation: () => R(-200, 200), opacity: 0, duration: 1.4, ease: 'power2.in', stagger: { each: .03, from: 'random' } }, .25)
      .to('.blk:not(.weak)', { y: () => R(6, 40), rotation: () => R(-14, 14), transformOrigin: '50% 50%', duration: 1.2, ease: 'back.out(2)', stagger: { each: .04, from: 'random' } }, .3)
      .to('.blk.weak', { y: 170, rotation: () => R(-30, 30), transformOrigin: '50% 50%', opacity: 0, duration: 2.2, ease: 'power2.in', stagger: .12 }, 1)
      .to('.fig .body', { y: () => R(50, 150), rotation: () => R(-120, 120), transformOrigin: '50% 100%', opacity: 0, duration: 1.6, ease: 'power2.in', stagger: { each: .16, from: 'random' } }, .9)
      .call(amb4a, null, 1);
    $$('.canoe').forEach((c, i) => {
      const st = canoeState(c), tx = +c.dataset.x;
      st.x = tx < 800 ? -260 : 1860; st.dx = 0;
      tl.to(st, { x: tx, duration: R(1.5, 2.6), ease: 'power3.out', onUpdate: () => placeCanoe(c) }, .4 + i * .11);
    });
    tl.call(amb4b, null, 5);
    return tl;
  }

  function finale(tl, at) {
    tl.to('#moon', { opacity: 0, duration: 13, ease: 'sine.in' }, at)
      .to('#moonHalo', { opacity: 0, duration: 12, ease: 'sine.in' }, at)
      .to('#rim', { opacity: 0, duration: 9 }, at)
      .to('#lostGold', { opacity: 0, duration: 8 }, at + 1)
      .to('#ground', { opacity: .25, duration: 12 }, at)
      .to(FX, { alpha: 0, duration: 10 }, at + 3)
      .to('#black', { opacity: 1, duration: 7, ease: 'power1.in' }, at + 9);
    return tl;
  }

  // 4 → 5 : everything dissolves; the tree remains
  function t45() {
    const tl = gsap.timeline();
    $('#night').setAttribute('filter', 'url(#nightBlur)');
    tl.call(() => { S.chaos = false; }, null, 0)
      .to(S, { shake: 0, duration: 1.5 }, 0)
      .to('#flash', { opacity: 0, duration: 1.2 }, .2)
      .to('#nbBlur', { attr: { stdDeviation: 18 }, duration: 3, ease: 'power2.in' }, 0)
      .to('#night', { opacity: 0, duration: 2.6, ease: 'power1.in' }, 1)
      .add(look(5, 4), .5)
      .set('#night', { display: 'none' }, 4)
      .fromTo('#s5', { opacity: 0 }, { opacity: 1, duration: 4, ease: 'sine.inOut' }, 3)
      .fromTo('#moon', { opacity: 0, y: 30 }, { opacity: .85, y: 0, duration: 5, ease: 'sine.out' }, 3)
      .fromTo('#crown', { opacity: 0 }, { opacity: 1, duration: 4 }, 3.6)
      .call(amb5, null, 3);
    return finale(tl, 13);
  }

  // 5 → 6 : credit
  function creditIn(tl, at) {
    tl.set('#credit', { opacity: 1 }, at)
      .fromTo('.cr-by', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 1.8, ease: 'power2.out' }, at + .3)
      .fromTo('.cr-name span', { opacity: 0, y: 18, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.4, ease: 'power2.out', stagger: .05 }, at + .8);
    return tl;
  }
  function t56() {
    const tl = gsap.timeline();
    tl.to('#black', { opacity: 1, duration: 1 }, 0);
    return creditIn(tl, .8);
  }

  /* ============================================================
     RESTING STATES (start + stepping backward)
     ============================================================ */
  const hideAll = sel => gsap.set(sel, { display: 'none' });
  const SET = [
    () => {
      look(0, 0); amb0();
      const t = gsap.timeline();
      t.set('#title', { opacity: 1, y: 0 }, 0)
        .fromTo('#tName span', { opacity: 0, y: 20, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.8, ease: 'power2.out', stagger: .07 }, 1.4);
      return null;
    },
    () => { look(1, 0); hideAll('#s0'); gsap.set('#s1', { opacity: 1, y: 0 }); amb1(); return null; },
    () => { look(2, 0); hideAll('#s0, #s1'); gsap.set('#s2', { opacity: 1 }); amb2(); return null; },
    () => { look(3, 0); hideAll('#s0, #s1, #s2'); gsap.set('#night', { opacity: 1 }); S.storm = true; amb3(); return null; },
    () => {
      look(4, 0); hideAll('#s0, #s1, #s2');
      gsap.set('#night, #s4back, #s4front', { opacity: 1 });
      gsap.set('.plank', { opacity: 0 });
      gsap.set('.blk:not(.weak)', { y: () => R(6, 40), rotation: () => R(-14, 14), transformOrigin: '50% 50%' });
      gsap.set('.blk.weak, .fig', { opacity: 0 });
      gsap.set('#redWater', { opacity: .38 });
      fogDrift();
      $$('.canoe').forEach(c => { canoeState(c).x = +c.dataset.x; placeCanoe(c); });
      S.chaos = true; S.shake = 14; shakeLoop();
      amb4a(); amb4b();
      return null;
    },
    () => { look(5, 0); hideAll('#s0, #s1, #s2, #night'); gsap.set('#s5', { opacity: 1 }); amb5(); return finale(gsap.timeline(), 6); },
    () => { look(6, 0); hideAll('#s0, #s1, #s2, #night, #s5'); return creditIn(gsap.timeline(), .3); }
  ];
  const T = [null, t01, t12, t23, t34, t45, t56];
  const LAST = T.length - 1;

  /* ============================================================
     CONTROLLER
     ============================================================ */
  let cur = 0, tl = null, jumping = false;
  const black = $('#black');

  function jump(n) {
    if (jumping) return;
    jumping = true;
    gsap.globalTimeline.clear();
    gsap.to('#credit, #title', { opacity: 0, duration: .5 });
    gsap.to(black, { opacity: 1, duration: .5, onComplete() {
      requestAnimationFrame(() => {
        gsap.globalTimeline.clear();
        world.innerHTML = SNAP;
        CST.clear();
        S.sky = S.storm = S.chaos = false; S.shake = 0;
        gsap.set('#cam', { x: 0, y: 0, rotation: 0 });
        gsap.set('#flash, #credit, #title', { opacity: 0 });
        cur = n;
        tl = SET[n]();
        gsap.to(black, { opacity: 0, duration: n === 0 ? 2.4 : 1.1, ease: 'sine.inOut', onComplete: () => { jumping = false; } });
      });
    } });
  }
  function next() {
    if (jumping) return;
    if (tl && tl.isActive()) { tl.timeScale(cur === 5 ? 4 : 6); return; }
    if (cur === LAST) { jump(0); return; }
    cur++;
    tl = T[cur]();
  }
  function prev() {
    if (jumping) return;
    jump(Math.max(0, cur - 1));
  }

  addEventListener('keydown', e => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'f' || e.key === 'F') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.();
    }
  });
  addEventListener('click', next);
  addEventListener('contextmenu', e => { e.preventDefault(); prev(); });

  jump(0);
})();
</script>
</body>
</html>
